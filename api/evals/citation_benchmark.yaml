# The citation benchmark.
#
# The gate on every change to retrieval, the agent loop, and the model. Nothing
# about how answers are produced ships without running this first.
#
# WHAT IT MEASURES, IN ORDER
#
#   1. Did it cite the right pages?     <- the product
#   2. Did it say the right thing?      <- secondary
#
# A prettier answer citing the wrong page is a regression. An accountant who
# follows a citation to page 15 and finds nothing there stops trusting every
# answer we ever gave them.
#
# THE CORPUS, AND HOW TO GET IT
#
# Five public US federal small-business documents. Public so a run is
# reproducible, and absent from published benchmarks, so a model cannot have
# memorised the answers. Upload all five into one workspace before running.
#
#   irs_publication_583_starting_a_business.pdf        28pp
#     https://www.irs.gov/pub/irs-pdf/p583.pdf
#   irs_publication_334_tax_guide_small_business.pdf   57pp
#     https://www.irs.gov/pub/irs-pdf/p334.pdf
#   osha_small_business_handbook.pdf                   98pp
#     https://www.osha.gov/sites/default/files/publications/SMALL-BUSINESS.pdf
#   sba_business_planning_guide.pdf                    24pp
#     https://legacy.sba.gov/sites/default/files/2020-05/SD-SBDC-Business-Planning-Guide-R-3_2015_0.pdf
#   ada_guide_small_business.pdf                       20pp
#     https://archive.ada.gov/smbusgd.pdf
#
# EVERY PAGE HERE WAS VERIFIED, NOT ASSUMED (2026-08-04)
#
# The first draft of this file guessed page numbers. Checked against the real
# PDFs, almost every one was wrong, and two documents named did not exist at
# all. Worse, the guesses were plausible: "how long do I keep tax records" was
# pointed at a page whose "3 years" refers to reporting self-employment income
# to the SSA, not to record retention. The retention table is on page 15. A
# benchmark wrong about its own corpus reports broken retrieval when retrieval
# is fine, which is worse than having none.
#
# Pages below are PDF pages, one-indexed, as a citation resolves them. They do
# not match the numbers printed in the footers, which sit several behind.
#
# When adding a question: find the answer in the PDF first, then write the
# question. Never the other way round.
#
# FIELDS
#
#   id               stable, never reused
#   question         what a user types, phrased the lazy way people ask
#   citations        acceptable sources; each entry one file and its pages.
#                    Two entries means the answer needs both documents.
#   must_include     short factual strings that must appear. A number, a term.
#   must_not_include optional. A known wrong answer or a near-miss distractor.
#   must_be_refusal  optional; the honest answer is "the documents do not say".
#   notes            why this question is here, and what it is guarding.

questions:
  #
  # ---------- Single-document lookups ----------
  #

  - id: 1
    question: "how long do i keep tax records"
    citations:
      - file: "irs_publication_583_starting_a_business.pdf"
        pages: [15, 16]
    must_include: ["3 years"]
    must_not_include: ["3 months"]
    notes: >
      The answer spans two pages: Table 3 with the periods is on 15, the
      "How Long To Keep Records" section on 16. Either is a correct citation.
      Page 7 also says "3 years" but about reporting self-employment income to
      the SSA, so this is a distractor test as much as a lookup, and
      must_not_include catches an answer built from that page.
      Widened from [15] on 2026-08-04 after the first baseline: the pipeline
      cited 16 and was right. Verified against the PDF, not conceded.

  - id: 2
    question: "why do i need to keep business records"
    citations:
      - file: "irs_publication_583_starting_a_business.pdf"
        pages: [11]
    must_include: ["records"]
    notes: >
      Answer sits under a heading phrased differently from the question.

  - id: 3
    question: "what accounting method should i use"
    citations:
      - file: "irs_publication_583_starting_a_business.pdf"
        pages: [5]
    must_include: ["cash", "accrual"]
    notes: >
      Two named methods on one page.

  - id: 4
    question: "how do i check my workplace for hazards"
    citations:
      - file: "osha_small_business_handbook.pdf"
        pages: [8]
    must_include: ["self-inspection"]
    notes: >
      The document's own term is "self-inspection", which the question avoids.
      Fails if retrieval only does keyword overlap.

  - id: 5
    question: "cash or accrual accounting whats the difference"
    citations:
      - file: "irs_publication_334_tax_guide_small_business.pdf"
        pages: [14]
    must_include: ["cash method", "accrual"]
    notes: >
      Same concept as id 3 in a different document. Both are correct sources;
      this checks the right one is cited when the question names neither.

  - id: 6
    question: "can i deduct business travel"
    citations:
      - file: "irs_publication_334_tax_guide_small_business.pdf"
        pages: [34]
    must_include: ["transportation"]
    notes: >
      "travel" appears on six pages; only this one carries the deduction rules.

  - id: 7
    question: "what goes in an executive summary"
    citations:
      - file: "sba_business_planning_guide.pdf"
        pages: [4]
    must_include: ["executive summary"]
    notes: >
      Plain lookup.

  - id: 8
    question: "how do i describe my target market"
    citations:
      - file: "sba_business_planning_guide.pdf"
        pages: [14]
    must_include: ["target market"]
    notes: >
      Page 4 mentions target market in a contents-style pointer that literally
      says "See Details on Pages 14 and 15". Citing page 4 is the near-miss.

  - id: 9
    question: "do i have to make my shop wheelchair accessible"
    citations:
      - file: "ada_guide_small_business.pdf"
        pages: [6]
    must_include: ["readily achievable"]
    notes: >
      The legal test is a term of art the question does not use.

  - id: 10
    question: "how many employees before ada employment rules apply"
    citations:
      - file: "ada_guide_small_business.pdf"
        pages: [19]
    must_include: ["15 or more"]
    notes: >
      A number stated once, in a resources section rather than the main body.

  #
  # ---------- Numeric and table-heavy ----------
  #

  - id: 11
    question: "how long do i have to report a workplace death"
    citations:
      - file: "osha_small_business_handbook.pdf"
        pages: [15]
    must_include: ["8 hours"]
    must_not_include: ["24 hours"]
    notes: >
      Deaths are 8 hours, hospitalisations 24, and both sit in the same
      sentence. The classic adjacent-value error.

  - id: 12
    question: "when do i report an amputation to osha"
    citations:
      - file: "osha_small_business_handbook.pdf"
        pages: [15]
    must_include: ["24 hours"]
    must_not_include: ["8 hours"]
    notes: >
      The same sentence read the other way round. Passing one of 11 or 12 while
      failing the other means the model is pattern-matching, not reading.

  - id: 13
    question: "am i exempt from injury recordkeeping"
    citations:
      - file: "osha_small_business_handbook.pdf"
        pages: [14]
    must_include: ["partially exempt"]
    notes: >
      The document says partially exempt, never fully. An answer claiming a
      full exemption is wrong in a way that matters to a customer.

  - id: 14
    question: "how long do i keep injury records"
    citations:
      - file: "osha_small_business_handbook.pdf"
        pages: [15]
    must_include: ["five years"]
    must_not_include: ["3 years"]
    notes: >
      Retention appears in two documents with different answers, five years
      here and three in IRS 583. Tests that the right regime is cited.

  #
  # ---------- Multi-document synthesis ----------
  #

  - id: 15
    question: "what records do i keep for tax and for injuries and for how long"
    citations:
      - file: "irs_publication_583_starting_a_business.pdf"
        pages: [15, 16]
      - file: "osha_small_business_handbook.pdf"
        pages: [15]
    must_include: ["3 years", "five years"]
    notes: >
      Two regimes, two documents, two different retention periods. The failure
      to watch for is collapsing both into one number.

  - id: 16
    question: "how do i start a business and keep my taxes organized"
    citations:
      - file: "sba_business_planning_guide.pdf"
        pages: [4]
      - file: "irs_publication_583_starting_a_business.pdf"
        pages: [11]
    must_include: ["executive summary", "records"]
    notes: >
      Planning plus recordkeeping.

  - id: 17
    question: "what do i need to do to keep employees safe and my premises accessible"
    citations:
      - file: "osha_small_business_handbook.pdf"
        pages: [8]
      - file: "ada_guide_small_business.pdf"
        pages: [6]
    must_include: ["self-inspection", "readily achievable"]
    notes: >
      Two unrelated compliance regimes in one question.

  - id: 18
    question: "how do i write a business plan and set up accounting"
    citations:
      - file: "sba_business_planning_guide.pdf"
        pages: [4, 14]
      - file: "irs_publication_583_starting_a_business.pdf"
        pages: [5]
    must_include: ["executive summary", "target market", "accrual"]
    notes: >
      Three facts across two documents and three pages. The hardest grounded
      question here, and the one most likely to lose a citation quietly.

  - id: 19
    question: "what should i track for taxes and for travel expenses"
    citations:
      - file: "irs_publication_583_starting_a_business.pdf"
        pages: [11]
      - file: "irs_publication_334_tax_guide_small_business.pdf"
        pages: [34]
    must_include: ["records", "transportation"]
    notes: >
      Two IRS documents that overlap heavily. Tests picking the specific one.

  - id: 20
    question: "do i need an ein and what accounting method comes with it"
    citations:
      - file: "irs_publication_583_starting_a_business.pdf"
        pages: [4, 5]
    must_include: ["employer identification number", "cash"]
    notes: >
      Two facts, one document, adjacent pages.

  - id: 21
    question: "what forms do i keep for injuries and how long do i keep them"
    citations:
      - file: "osha_small_business_handbook.pdf"
        pages: [14, 15]
    must_include: ["OSHA 300", "five years"]
    notes: >
      Cross-page within one document, where the form name and the retention
      period are separated.

  #
  # ---------- Refusals ----------
  #

  - id: 22
    question: "how many paid vacation days do employees get"
    must_be_refusal: true
    notes: >
      No document defines vacation entitlement. Federal law does not require
      it, so a confident answer here is invention, not retrieval.

  - id: 23
    question: "what is the canadian gst rate"
    must_be_refusal: true
    notes: >
      Corpus is entirely US federal guidance.

  - id: 24
    question: "how do i register a trademark"
    must_be_refusal: true
    notes: >
      Plausibly small-business, genuinely absent. The dangerous kind: adjacent
      enough that a model may answer from training rather than documents.

  - id: 25
    question: "what health insurance plan should i buy for my staff"
    must_be_refusal: true
    notes: >
      Asks for advice rather than a fact. Should decline and say what the
      documents do cover.
