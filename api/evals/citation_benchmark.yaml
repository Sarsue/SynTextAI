# The citation benchmark.
#
# The gate on every change to retrieval, the agent loop, and the model. Nothing
# about how answers are produced ships without running this first.
#
# WHAT IT MEASURES, IN ORDER
#
#   1. Did it cite the right pages?     <- the product
#   2. Did it say the right thing?      <- secondary
#
# A prettier answer citing the wrong page is a regression. An accountant who
# follows a citation to page 15 and finds nothing there stops trusting every
# answer we ever gave them.
#
# THE CORPUS, AND HOW TO GET IT
#
# Five public US federal small-business documents. Public so a run is
# reproducible, and absent from published benchmarks, so a model cannot have
# memorised the answers. Upload all five into one workspace before running.
#
#   irs_publication_583_starting_a_business.pdf        28pp
#     https://www.irs.gov/pub/irs-pdf/p583.pdf
#   irs_publication_334_tax_guide_small_business.pdf   57pp
#     https://www.irs.gov/pub/irs-pdf/p334.pdf
#   osha_small_business_handbook.pdf                   98pp
#     https://www.osha.gov/sites/default/files/publications/SMALL-BUSINESS.pdf
#   sba_business_planning_guide.pdf                    24pp
#     https://legacy.sba.gov/sites/default/files/2020-05/SD-SBDC-Business-Planning-Guide-R-3_2015_0.pdf
#   ada_guide_small_business.pdf                       20pp
#     https://archive.ada.gov/smbusgd.pdf
#
# EVERY PAGE HERE WAS VERIFIED, NOT ASSUMED (2026-08-04)
#
# The first draft of this file guessed page numbers. Checked against the real
# PDFs, almost every one was wrong, and two documents named did not exist at
# all. Worse, the guesses were plausible: "how long do I keep tax records" was
# pointed at a page whose "3 years" refers to reporting self-employment income
# to the SSA, not to record retention. The retention table is on page 15. A
# benchmark wrong about its own corpus reports broken retrieval when retrieval
# is fine, which is worse than having none.
#
# Pages below are PDF pages, one-indexed, as a citation resolves them. They do
# not match the numbers printed in the footers, which sit several behind.
#
# When adding a question: find the answer in the PDF first, then write the
# question. Never the other way round.
#
# FIELDS
#
#   id               stable, never reused
#   question         what a user types, phrased the lazy way people ask
#   citations        acceptable sources; each entry one file and its pages.
#                    Two entries means the answer needs both documents.
#   must_include     short factual strings that must appear. A number, a term.
#   must_not_include optional. A known wrong answer or a near-miss distractor.
#   must_be_refusal  optional; the honest answer is "the documents do not say".
#   notes            why this question is here, and what it is guarding.

questions:
  #
  # ---------- Single-document lookups ----------
  #

  - id: 1
    question: "how long do i keep tax records"
    citations:
      - file: "irs_publication_583_starting_a_business.pdf"
        pages: [15, 16]
    must_include: ["3 years"]
    must_not_include: ["3 months"]
    notes: >
      The answer spans two pages: Table 3 with the periods is on 15, the
      "How Long To Keep Records" section on 16. Either is a correct citation.
      Page 7 also says "3 years" but about reporting self-employment income to
      the SSA, so this is a distractor test as much as a lookup, and
      must_not_include catches an answer built from that page.
      Widened from [15] on 2026-08-04 after the first baseline: the pipeline
      cited 16 and was right. Verified against the PDF, not conceded.

  - id: 2
    question: "why do i need to keep business records"
    citations:
      - file: "irs_publication_583_starting_a_business.pdf"
        pages: [11]
    must_include: ["records"]
    notes: >
      Answer sits under a heading phrased differently from the question.

  - id: 3
    question: "what accounting method should i use"
    citations:
      - file: "irs_publication_583_starting_a_business.pdf"
        pages: [5]
    must_include: ["cash", "accrual"]
    notes: >
      Two named methods on one page.

  - id: 4
    question: "how do i check my workplace for hazards"
    citations:
      - file: "osha_small_business_handbook.pdf"
        pages: [8]
    must_include: ["self-inspection"]
    notes: >
      The document's own term is "self-inspection", which the question avoids.
      Fails if retrieval only does keyword overlap.

  - id: 5
    question: "cash or accrual accounting whats the difference"
    citations:
      - file: "irs_publication_334_tax_guide_small_business.pdf"
        pages: [14]
    must_include: ["cash method", "accrual"]
    notes: >
      Same concept as id 3 in a different document. Both are correct sources;
      this checks the right one is cited when the question names neither.

  - id: 6
    question: "can i deduct business travel"
    citations:
      - file: "irs_publication_334_tax_guide_small_business.pdf"
        pages: [40, 41]
    must_include: ["meals"]
    notes: >
      Corrected 2026-08-06, from page 34. The publication separates two things
      this question does not: its own index reads "Transportation expenses 34,
      Travel expenses 40", its contents page reads "Car and Truck Expenses ->
      34, Travel and Meals -> 40", and page 35 says outright that "business
      transportation does not include expenses you have while traveling away
      from home overnight. Those expenses are deductible as travel expenses."
      Page 34 is local transportation. The question asks about travel.

      The pipeline cited 40 and 41 and was marked wrong for three runs. Checked
      against the document's index and outline, not conceded because the score
      was poor: the answer it gave, meals and lodging at 50% with transport to
      the destination, is what pages 40 and 41 actually say.

  - id: 7
    question: "what goes in an executive summary"
    citations:
      - file: "sba_business_planning_guide.pdf"
        pages: [4]
    must_include: ["executive summary"]
    notes: >
      Plain lookup.

  - id: 8
    question: "how do i describe my target market"
    citations:
      - file: "sba_business_planning_guide.pdf"
        pages: [14]
    must_include: ["target market"]
    notes: >
      Page 4 mentions target market in a contents-style pointer that literally
      says "See Details on Pages 14 and 15". Citing page 4 is the near-miss.

  - id: 9
    question: "do i have to make my shop wheelchair accessible"
    citations:
      - file: "ada_guide_small_business.pdf"
        pages: [6]
    must_include: ["readily achievable"]
    notes: >
      The legal test is a term of art the question does not use.

  - id: 10
    question: "how many employees before ada employment rules apply"
    citations:
      - file: "ada_guide_small_business.pdf"
        pages: [19]
    must_include: ["15 or more"]
    notes: >
      A number stated once, in a resources section rather than the main body.

  #
  # ---------- Numeric and table-heavy ----------
  #

  - id: 11
    question: "how long do i have to report a workplace death"
    citations:
      - file: "osha_small_business_handbook.pdf"
        pages: [15]
    must_include: ["8 hours"]
    notes: >
      Deaths are 8 hours, hospitalisations 24, and both sit in the same
      sentence. The classic adjacent-value error.
      must_not_include: ["24 hours"] was removed on 2026-08-04. It punished the
      best answer in the first baseline, which said deaths are 8 hours and then
      correctly added that hospitalisations and amputations are 24. Naming the
      neighbouring value is what a careful answer does. Pairing this with id 12
      already catches a model that has the two the wrong way round: getting one
      right and the other wrong is the tell, and neither substring can see that.

  - id: 12
    question: "when do i report an amputation to osha"
    citations:
      - file: "osha_small_business_handbook.pdf"
        pages: [15]
    must_include: ["24 hours"]
    notes: >
      The same sentence read the other way round. Passing one of 11 or 12 while
      failing the other means the model is pattern-matching, not reading. See
      id 11 for why the mirrored must_not_include was dropped.

  - id: 13
    question: "am i exempt from injury recordkeeping"
    citations:
      - file: "osha_small_business_handbook.pdf"
        pages: [14]
    must_include: ["partially exempt"]
    notes: >
      The document says partially exempt, never fully. An answer claiming a
      full exemption is wrong in a way that matters to a customer.

  - id: 14
    question: "how long do i keep injury records"
    citations:
      - file: "osha_small_business_handbook.pdf"
        pages: [15]
    must_include: [["five years", "five (5) years", "5 years"]]
    must_not_include: ["3 years"]
    notes: >
      Retention appears in two documents with different answers, five years
      here and three in IRS 583. Tests that the right regime is cited.

  #
  # ---------- Multi-document synthesis ----------
  #

  - id: 15
    question: "what records do i keep for tax and for injuries and for how long"
    citations:
      - file: "irs_publication_583_starting_a_business.pdf"
        pages: [15, 16]
      - file: "osha_small_business_handbook.pdf"
        pages: [15]
    must_include:
      - ["3 years", "three years"]
      - ["five years", "five (5) years", "5 years"]
    notes: >
      Two regimes, two documents, two different retention periods. The failure
      to watch for is collapsing both into one number.

  - id: 16
    question: "how do i start a business and keep my taxes organized"
    citations:
      - file: "sba_business_planning_guide.pdf"
        pages: [4]
      - file: "irs_publication_583_starting_a_business.pdf"
        pages: [11]
    must_include: ["executive summary", "records"]
    notes: >
      Planning plus recordkeeping.

  - id: 17
    question: "what do i need to do to keep employees safe and my premises accessible"
    citations:
      - file: "osha_small_business_handbook.pdf"
        pages: [8]
      - file: "ada_guide_small_business.pdf"
        pages: [6]
    must_include: ["self-inspection", "readily achievable"]
    notes: >
      Two unrelated compliance regimes in one question.

  - id: 18
    question: "how do i write a business plan and set up accounting"
    citations:
      - file: "sba_business_planning_guide.pdf"
        pages: [4, 14]
      - file: "irs_publication_583_starting_a_business.pdf"
        pages: [5]
    must_include: ["executive summary", "target market", "accrual"]
    notes: >
      Three facts across two documents and three pages. The hardest grounded
      question here, and the one most likely to lose a citation quietly.

  - id: 19
    question: "what should i track for taxes and for travel expenses"
    citations:
      - file: "irs_publication_583_starting_a_business.pdf"
        pages: [11]
      - file: "irs_publication_334_tax_guide_small_business.pdf"
        pages: [40, 41]
    must_include: ["records", "meals"]
    notes: >
      Two IRS documents that overlap heavily. Tests picking the specific one.
      The travel page was corrected from 34 to 40 on 2026-08-06 for the same
      reason as question 6: 34 is local transportation, 40 is travel.

  - id: 20
    question: "do i need an ein and what accounting method comes with it"
    citations:
      - file: "irs_publication_583_starting_a_business.pdf"
        pages: [4, 5]
    must_include: ["employer identification number", "cash"]
    notes: >
      Two facts, one document, adjacent pages.

  - id: 21
    question: "what forms do i keep for injuries and how long do i keep them"
    citations:
      - file: "osha_small_business_handbook.pdf"
        pages: [14, 15]
    must_include:
      - "Form 300"
      - ["five years", "five (5) years", "5 years"]
    notes: >
      Cross-page within one document, where the form name and the retention
      period are separated.
      Corrected 2026-08-04. This asked for the literal "OSHA 300", which the
      handbook never writes: it says "Form 300, 300A, and 301". The first
      baseline named all three forms and the five-year period and was scored
      wrong twice, once for a form name the source does not use and once for
      writing "five (5) years". Both now accept the document's own wording.


  #
  # ---------- Multi-document synthesis, second set (added 2026-08-06) ----------
  #
  # Five was too thin. Two confident conclusions were drawn from that sample
  # during the agent work and neither survived four runs: a multi-document
  # advantage that turned out to be a two-run artifact, and a 4/4 refusal score
  # that was one lucky run. A metric you intend to optimise against needs
  # enough questions that a single flip cannot move it 20%.
  #
  # Each of these was built by reading the documents first and writing the
  # question after, and every must_include string below was checked against the
  # page it is claimed on before being written down. Two were caught that way:
  # "workers' compensation" does not appear on IRS 334 page 37, which writes it
  # with a typographic apostrophe, while the SBA guide writes "Worker's
  # Compensation" in the singular; and OSHA page 6 stores "3. 6 million" with a
  # space after the point. Both would have failed a correct answer.

  - id: 27
    question: "do i need workers comp insurance and can i deduct it"
    citations:
      - file: "sba_business_planning_guide.pdf"
        pages: [9]
      - file: "irs_publication_334_tax_guide_small_business.pdf"
        pages: [37]
    must_include:
      - ["workers' compensation", "worker's compensation", "workers compensation",
         "workers\u2019 compensation"]
      - "deduct"
    notes: >
      The same subject in two documents saying two different things about it:
      the SBA guide recommends carrying it, IRS 334 lists it among deductible
      premiums. An answer from either document alone is half an answer, and the
      half it gives sounds complete, which is what makes this worth testing.
      The spelling differs between the two documents, so must_include accepts
      either apostrophe and the plural or singular form. That is not a
      concession: the fact is the coverage, not the punctuation.

  - id: 28
    question: "what do i file for my employees and what state taxes do i owe for them"
    citations:
      - file: "irs_publication_583_starting_a_business.pdf"
        pages: [9]
      - file: "sba_business_planning_guide.pdf"
        pages: [9]
    must_include: ["W-2", "unemployment"]
    notes: >
      Federal filing and state contribution, one in each document, and neither
      mentions the other. A single ranked list tends to return one regime and
      stop, because both halves score well on "employees" and "taxes".

  - id: 29
    question: "what if a customer cannot get through my front door and what if someone is hurt on site"
    citations:
      - file: "ada_guide_small_business.pdf"
        pages: [11]
      - file: "osha_small_business_handbook.pdf"
        pages: [15]
    must_include: [["curbside", "take-out", "home delivery"], "8 hours"]
    notes: >
      Two unrelated obligations a shop owner genuinely holds at once. The ADA
      page gives the alternative service required when an entrance cannot be
      made accessible; the OSHA page gives the reporting deadline.
      UNANSWERABLE IN ONE RETRIEVAL, measured 2026-08-06:
        whole question             osha p15 not in the top 25
        second half alone          osha p15 at rank 18
        second half as a need      osha p15 at rank 2
      The accessibility half dominates the ranking and buries the other
      entirely, so the passage never reaches the answer step at all. No amount
      of fusion, reranking or answer-side work recovers a page that was never
      returned. This is the one question in the set that a second retrieval is
      demonstrably required for rather than plausibly helpful, which makes it
      the test to watch when MAX_RETRIEVALS is raised above one.

  - id: 30
    question: "how much cash before i have to report it and do i need a licence to serve food"
    citations:
      - file: "irs_publication_583_starting_a_business.pdf"
        pages: [9]
      - file: "sba_business_planning_guide.pdf"
        pages: [8]
    must_include: [["Form 8300", "8300"], ["food license", "Health Department"]]
    notes: >
      A caf\u00e9 owner's question, and the two halves live in documents that share
      almost no vocabulary. The tax half is a federal reporting form; the
      licence half is a state health inspection. Retrieval that spreads across
      documents finds both; retrieval that ranks globally on one query finds
      whichever half the question's wording favours.

  - id: 31
    question: "why should i bother with a safety program and what records do i need to keep"
    citations:
      - file: "osha_small_business_handbook.pdf"
        pages: [6]
      - file: "irs_publication_583_starting_a_business.pdf"
        pages: [11]
    must_include: [["safety and health program", "safety program"], "records"]
    notes: >
      Deliberately vague on the second half. "Records" could mean injury
      records or tax records, and the honest answer covers what the documents
      actually say rather than picking one. Guards against an answer that
      resolves an ambiguous question by silently narrowing it.

  #
  # ---------- Refusals ----------
  #

  - id: 22
    question: "how many paid vacation days do employees get"
    must_be_refusal: true
    notes: >
      No document defines vacation entitlement. Federal law does not require
      it, so a confident answer here is invention, not retrieval.
      Re-verified 2026-08-04. "Vacation" does appear, once, on page 37 of IRS
      334, in a list of what counts as taxable wages: "Vacation pay". The
      entitlement, which is what the question asks for, is absent. The word
      being present is what makes this worth keeping.

  - id: 23
    question: "what is the canadian gst rate"
    must_be_refusal: true
    notes: >
      Corpus is entirely US federal guidance.

  - id: 24
    question: "how do i register a trademark"
    citations:
      - file: "sba_business_planning_guide.pdf"
        pages: [10]
    must_include: ["state level", "federal level"]
    must_not_include: ["TESS"]
    notes: >
      NOT A REFUSAL, corrected 2026-08-04. This was written as one, on the note
      "plausibly small-business, genuinely absent". It is not absent: the SBA
      guide has a "Trademarks/Service Marks" section on page 10 giving the two
      registration levels and the contacts for each. Nobody checked, which is
      the exact failure this file's header warns about, committed by the same
      hand that wrote the warning.
      Found by the tool agent, which searched, quoted the passage, and added
      that the guide has no step-by-step procedure. The fixed pipeline had
      earlier answered this with an invented USPTO walkthrough including a TESS
      database search, so must_not_include keeps TESS: the word appears nowhere
      in the corpus and is the tell that an answer came from training data.
      What this now guards is harder and more useful than a refusal. The page
      says registration exists and where to go, and does not say how. A good
      answer gives what is there and says the rest is not.
      must_include asks for the two levels as separate terms rather than the
      document's sentence verbatim. Demanding "state level or the federal level"
      as one string tests whether the model quoted, not whether it understood,
      and it failed an answer that said "at the state level (e.g. the Secretary
      of State) or the federal level". Both terms still have to appear.

  - id: 26
    question: "what do i do if we have a data breach"
    must_be_refusal: true
    notes: >
      Verified absent 2026-08-04: no document mentions a data breach,
      cybersecurity, or GDPR. Replaces id 24 as the adjacent-but-absent test.
      Adjacent because these are five compliance documents for small business
      owners and a breach is a compliance event, so a model reaching for
      training data has every excuse. Checked against the corpus before being
      written, not after.

  - id: 25
    question: "what health insurance plan should i buy for my staff"
    must_be_refusal: true
    notes: >
      Asks for advice rather than a fact. Should decline and say what the
      documents do cover.
      Re-verified 2026-08-04. Health insurance is discussed, on four pages of
      IRS 334, but only as a deductible expense. Which plan to buy is nowhere,
      and is not the kind of thing a document could answer anyway. The topic
      being present and the answer being absent is the point.
