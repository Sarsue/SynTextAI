# The citation benchmark.
#
# This is the gate on every change to retrieval, the agent loop, and the model.
# Nothing about how answers are produced ships without running this first.
#
# WHAT IT MEASURES, IN ORDER OF IMPORTANCE
#
#   1. Did it cite the right page?      <- the product
#   2. Did it say the right thing?      <- secondary
#
# That order is deliberate. A prettier answer citing the wrong page is a
# regression, not an improvement. An accountant who follows a citation to page
# 14 and finds nothing there stops trusting every other answer we have given
# them.
#
# HOW TO WRITE A GOOD ENTRY
#
# Write the question the way a real person would type it, badly and briefly.
# "how long do i have to cancel" is a better test than "What is the notice
# period specified in the termination clause?" because it is what actually
# arrives. The second one is easy for any system; the first is where retrieval
# earns its money.
#
# Pick questions where you know the answer and can point at the page. If you
# have to go looking, it does not belong here yet.
#
# Aim for a spread rather than twenty of the same shape:
#   - a fact stated once, plainly, on one page
#   - a fact that appears in a table or a numeric-dense page
#   - a question whose answer spans two pages or two documents
#   - a question the documents genuinely do not answer (see must_be_refusal)
#   - a question where two documents disagree, if you have one
#
# The last two matter most and are the ones people forget. A system that never
# says "your documents do not cover that" will invent something instead, and
# that is the failure that loses a customer.
#
# FIELDS
#
#   id             stable, never reused. Referenced in results over time.
#   question       what the user types
#   file           the document the answer lives in, as uploaded
#   pages          the page or pages a correct citation may point at.
#                  More than one is fine when the fact spans a boundary.
#   must_include   strings that must appear in the answer. Keep them short and
#                  factual: a number, a name, a date. Not a whole sentence.
#   must_not_include  optional. Use for a known wrong answer, for example a
#                  superseded figure from an older document.
#   must_be_refusal   optional, true when the honest answer is "the documents
#                  do not say". pages and must_include are then ignored.
#   notes          why this question is here. Future you will want it.
#
# RUNNING IT
#
# Capture the baseline against the current pipeline BEFORE changing anything.
# Every later comparison is measured against that first run, so a missing
# baseline makes the whole exercise a matter of opinion.

questions:
  # ---- worked examples, replace these ----

  - id: 1
    question: "how much notice do i need to give"
    file: "example-lease.pdf"
    pages: [12]
    must_include: ["60 days"]
    notes: >
      A plain fact on one page, phrased the lazy way a person actually asks.
      If this one fails, nothing else matters.

  - id: 2
    question: "whats the rate for a single filer earning 80k"
    file: "example-tax-tables.pdf"
    pages: [34, 35]
    must_include: ["22%"]
    must_not_include: ["24%"]
    notes: >
      A numeric table spanning a page boundary. This is the shape that breaks
      text-layer extraction, because columns interleave and rows collapse.
      must_not_include catches the classic failure of reading the adjacent row.

  - id: 3
    question: "do we offer paternity leave"
    file: "example-handbook.pdf"
    must_be_refusal: true
    notes: >
      The handbook genuinely does not cover this. The correct answer is to say
      so. Any confident answer here is a hallucination, and this entry exists
      to catch exactly that.

  # ---- yours below ----
