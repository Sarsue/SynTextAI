<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />

  <!-- Primary Meta Tags -->
  <title>SynText AI - Instant cited answers from your company documents</title>
  <meta name="title" content="SynText AI - Instant cited answers from your company documents">
  <meta name="description" content="Ask your company documents a question and get an answer in seconds, with a link to the exact page it came from. Built for practices whose SOPs, policies and manuals live in files nobody can find." />
  <meta name="keywords" content="document search, document Q&A, cited answers, knowledge base, SOP search, internal documentation, small business AI, policy lookup, PDF search" />
  <meta name="author" content="SynText AI Team" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://syntextai.com/" />
  <meta property="og:title" content="SynText AI - Instant cited answers from your company documents" />
  <meta property="og:description" content="Ask your company documents a question and get an answer in seconds, with a link to the exact page it came from. Built for practices whose SOPs, policies and manuals live in files nobody can find." />
  <meta property="og:image" content="/og-image.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://syntextai.com/" />
  <meta property="twitter:title" content="SynText AI - Instant cited answers from your company documents" />
  <meta property="twitter:description" content="Ask your company documents a question and get an answer in seconds, with a link to the exact page it came from. Built for practices whose SOPs, policies and manuals live in files nobody can find." />
  <meta property="twitter:image" content="/og-image.png" />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://syntextai.com/" />

  <!-- Preconnect to critical domains -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://js.stripe.com" crossorigin />

  <!-- Primary UI font (see src/index.css --font) -->
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="apple-touch-icon" href="/logo192.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Structured Data - JSON-LD -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "SynText AI",
      "description": "Ask your company documents a question and get an answer in seconds, with a link to the exact page it came from. Built for practices whose SOPs, policies and manuals live in files nobody can find.",
      "url": "https://syntextai.com",
      "applicationCategory": "BusinessApplication",
      "offers": {
        "@type": "Offer",
        "price": "99.00",
        "priceCurrency": "USD",
        "description": "Starter plan, billed monthly, 10 seats included"
      }
    }
  </script>

  <!-- Stripe Payment Integration -->
  <script async src="https://js.stripe.com/v3/buy-button.js"></script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
