services:
  # How the API tells the worker there is work, and how the worker tells the
  # API to update somebody's browser. Notifications only: the queue itself
  # stays in Postgres, so losing this container costs latency, not jobs.
  #
  # No published ports on purpose. Nothing outside this network should be able
  # to reach it, and an open Redis on a public IP is scanned and taken over
  # within hours.
  redis:
    image: redis:7-alpine
    container_name: syntextai-redis
    restart: unless-stopped
    # Notifications are worthless once they are a few seconds old, so there is
    # nothing here worth writing to disk or reloading after a restart.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  syntextaiapp:
    image: osasdeeon/syntextai:latest
    container_name: syntextaiapp
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379/0
      # App DB pool (keep low to avoid exhausting managed Postgres connection limits)
      - DB_POOL_SIZE=2
      - DB_MAX_OVERFLOW=1
    # Database connection is handled via environment variables
    volumes:
      - ./api/config:/app/api/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
          
  worker:
    image: osasdeeon/syntextai:latest
    container_name: syntextai-worker
    command: python -m api.workers.worker
    depends_on:
      - redis
    # The shared image healthchecks port 3000, which the worker never
    # serves. Assert loop liveness via the heartbeat file instead.
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(cat /tmp/worker_heartbeat 2>/dev/null || echo 0) )) -lt 180"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    env_file:
      - .env
    environment:
      # Queries and ingests have separate budgets so a large upload can never
      # block another tenant's chat. Ingests stay capped for memory; a file
      # over HEAVY_FILE_BYTES additionally takes an exclusive slot.
      - QUERY_CONCURRENCY=4
      - INGEST_CONCURRENCY=2
      - MAX_RUNS_PER_USER=3
      # Still 10, and still meaningful. The worker now wakes the instant work
      # is announced, so this only covers an announcement that went out while
      # nothing was listening (a restart, a Redis outage). It is the floor on
      # how late a job can be, not the normal wait.
      - POLL_INTERVAL=10
      - REDIS_URL=redis://redis:6379/0
      - API_BASE_URL=http://syntextaiapp:3000  # ⬅️ Use service name instead of localhost
      # Worker-specific connection pool settings (smaller to avoid exhausting DB connections)
      - DB_POOL_SIZE=1
      - DB_MAX_OVERFLOW=0
    volumes:
      - ./api/config:/app/api/config
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    driver: bridge