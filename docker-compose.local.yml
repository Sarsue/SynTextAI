
# Local stack. MUST be run with --env-file .env.dev:
#
#     docker compose --env-file .env.dev -f docker-compose.local.yml up -d --build
#
# `env_file:` below only sets each container's runtime environment. The
# ${VAR} build args are interpolated by Compose itself, which reads the
# project's default .env — the production file — unless told otherwise. Without
# the flag the frontend is built with the LIVE Stripe publishable key while the
# backend runs on the test secret, and every test card is refused with "your
# request was in live mode, but used a known test card".
services:
  # Throwaway local Postgres so migrations and features can be tested without
  # touching the managed production database. pgvector image, because the
  # chunks table needs the vector extension.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: syntextai-postgres-local
    environment:
      # Hardcoded on purpose. Compose interpolates ${...} from .env, which is
      # the production file, so ${DATABASE_PASSWORD} here would pull the real
      # managed-database password. These must stay literal.
      - POSTGRES_DB=syntextai
      - POSTGRES_USER=syntext
      - POSTGRES_PASSWORD=localdev
    ports:
      # 5433 on the host, so this never collides with a local Postgres install
      - "5433:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syntext -d syntextai"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - syntextai_network
    restart: unless-stopped

  syntextaiapp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Frontend environment variables (Vite only exposes VITE_-prefixed vars)
        - NODE_ENV=development
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
        - VITE_STRIPE_API_KEY=${VITE_STRIPE_API_KEY}
        - VITE_POST_HOG_API_KEY=${VITE_POST_HOG_API_KEY}

    container_name: syntextaiapp-local
    ports:
      - "3000:3000"
    env_file:
      - .env.dev
    volumes:
      - ./api:/app/api
      - ./.env.dev:/app/.env
      # Mount CA certificate for PostgreSQL SSL
      - ./api/config/ca-certificate.crt:/app/api/config/ca-certificate.crt:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - syntextai_network

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          memory: 2G
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=development
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
        - VITE_STRIPE_API_KEY=${VITE_STRIPE_API_KEY}
        - VITE_POST_HOG_API_KEY=${VITE_POST_HOG_API_KEY}

    container_name: syntextai-worker-local
    command: python -m api.workers.worker
    # The shared image healthchecks port 3000, which the worker never
    # serves. Assert loop liveness via the heartbeat file instead.
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(cat /tmp/worker_heartbeat 2>/dev/null || echo 0) )) -lt 180"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    working_dir: /app
    env_file:
      - .env.dev
    environment:
      # Inside the worker container localhost is the worker, not the API, so the
      # default sends every websocket notification to itself and it is refused.
      # The answer is generated and saved, but the browser never hears about it
      # and the message appears to vanish. Present in docker-compose.yml,
      # missing here.
      - API_BASE_URL=http://syntextaiapp:3000
      # Which agent answers. Set to "tools" to let the model run the search
      # itself. Defaults to the fixed pipeline so a stray shell export cannot
      # quietly change what every local query does.
      - AGENT_MODE=${AGENT_MODE:-pipeline}
      - QUERY_CONCURRENCY=4
      - INGEST_CONCURRENCY=2
      - MAX_RUNS_PER_USER=3
      - POLL_INTERVAL=10
      # PostgreSQL SSL cert path
      - DATABASE_SSLROOTCERT=/app/api/config/ca-certificate.crt
      # Worker-specific connection pool settings (smaller to avoid exhausting DB connections)
      - DB_POOL_SIZE=3
      - DB_MAX_OVERFLOW=2
    volumes:
      - ./api:/app/api
      - ./.env.dev:/app/.env
      - ./api/config/ca-certificate.crt:/app/api/config/ca-certificate.crt:ro
    networks:
      - syntextai_network
    
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          memory: 1G
    restart: unless-stopped

networks:
  syntextai_network:
    driver: bridge

volumes:
  postgres_local_data: