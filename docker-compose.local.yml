
# Local stack. MUST be run with --env-file .env.dev:
#
#     docker compose --env-file .env.dev -f docker-compose.local.yml up -d --build
#
# `env_file:` below only sets each container's runtime environment. The
# ${VAR} build args are interpolated by Compose itself, which reads the
# project's default .env — the production file — unless told otherwise. Without
# the flag the frontend is built with the LIVE Stripe publishable key while the
# backend runs on the test secret, and every test card is refused with "your
# request was in live mode, but used a known test card".
services:
  # Throwaway local Postgres so migrations and features can be tested without
  # touching the managed production database. pgvector image, because the
  # chunks table needs the vector extension.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: syntextai-postgres-local
    environment:
      # Hardcoded on purpose. Compose interpolates ${...} from .env, which is
      # the production file, so ${DATABASE_PASSWORD} here would pull the real
      # managed-database password. These must stay literal.
      - POSTGRES_DB=syntextai
      - POSTGRES_USER=syntext
      - POSTGRES_PASSWORD=localdev
    ports:
      # 5433 on the host, so this never collides with a local Postgres install
      - "5433:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syntext -d syntextai"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - syntextai_network
    restart: unless-stopped

  # Local mirror of the notification bus. Same reasoning as production: this
  # carries "there is work" and "tell this browser", never the queue itself.
  redis:
    image: redis:7-alpine
    container_name: syntextai-redis-local
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      # 6380 on the host so it cannot collide with a local Redis install.
      # Exposed here and deliberately not in production, so that tests running
      # outside the containers can reach it.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - syntextai_network
    restart: unless-stopped

  syntextaiapp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Frontend environment variables (Vite only exposes VITE_-prefixed vars)
        - NODE_ENV=development
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
        - VITE_STRIPE_API_KEY=${VITE_STRIPE_API_KEY}
        - VITE_POST_HOG_API_KEY=${VITE_POST_HOG_API_KEY}
        # Default to empty rather than warning on every build: absent is a
        # valid state, and it means the Drive button does not render.
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
        - VITE_GOOGLE_API_KEY=${VITE_GOOGLE_API_KEY:-}

    container_name: syntextaiapp-local
    ports:
      - "3000:3000"
    env_file:
      - .env.dev
    volumes:
      - ./api:/app/api
      - ./.env.dev:/app/.env
      # Mount CA certificate for PostgreSQL SSL
      - ./api/config/ca-certificate.crt:/app/api/config/ca-certificate.crt:ro
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - syntextai_network

    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          memory: 2G
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=development
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
        - VITE_STRIPE_API_KEY=${VITE_STRIPE_API_KEY}
        - VITE_POST_HOG_API_KEY=${VITE_POST_HOG_API_KEY}
        # Default to empty rather than warning on every build: absent is a
        # valid state, and it means the Drive button does not render.
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID:-}
        - VITE_GOOGLE_API_KEY=${VITE_GOOGLE_API_KEY:-}

    container_name: syntextai-worker-local
    command: python -m api.workers.worker
    # The shared image healthchecks port 3000, which the worker never
    # serves. Assert loop liveness via the heartbeat file instead.
    healthcheck:
      test: ["CMD-SHELL", "test $(( $(date +%s) - $(cat /tmp/worker_heartbeat 2>/dev/null || echo 0) )) -lt 180"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    working_dir: /app
    env_file:
      - .env.dev
    environment:
      # Inside the worker container localhost is the worker, not the API, so the
      # default sends every websocket notification to itself and it is refused.
      # The answer is generated and saved, but the browser never hears about it
      # and the message appears to vanish. Present in docker-compose.yml,
      # missing here.
      - API_BASE_URL=http://syntextaiapp:3000
      # How many retrievals one question may make. One is the shipped
      # behaviour; raise it to measure whether retrieving per information
      # need is worth the extra context.
      - MAX_RETRIEVALS=${MAX_RETRIEVALS:-1}
      - RETRIEVAL_TOP_K=${RETRIEVAL_TOP_K:-25}
      - QUERY_CONCURRENCY=4
      - INGEST_CONCURRENCY=2
      - MAX_RUNS_PER_USER=3
      # The floor on how late a job can be, not the normal wait: the worker
      # now wakes as soon as work is announced on REDIS_URL.
      - POLL_INTERVAL=10
      - REDIS_URL=redis://redis:6379/0
      # PostgreSQL SSL cert path
      - DATABASE_SSLROOTCERT=/app/api/config/ca-certificate.crt
      # Worker-specific connection pool settings (smaller to avoid exhausting DB connections)
      - DB_POOL_SIZE=3
      - DB_MAX_OVERFLOW=2
      # Measured 2026-08-13: a vision page takes ~166s regardless of image size
      # (150 dpi and 80 dpi are within noise of each other) and regardless of
      # output length (490-700 tokens). It is a fixed per-request cost at the
      # far end, so throughput comes from concurrency and nothing else. Being
      # raised here to find the endpoint's ceiling; failures are now cheap,
      # since a refused page falls back to its text layer and every page that
      # succeeds is banked in page_reads.
      - VISION_CONCURRENCY=6
    volumes:
      - ./api:/app/api
      - ./.env.dev:/app/.env
      - ./api/config/ca-certificate.crt:/app/api/config/ca-certificate.crt:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - syntextai_network

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          memory: 1G
    restart: unless-stopped

  # Vite dev server, for driving the UI by hand or with a browser tool.
  #
  # Not part of the default stack. Start it deliberately:
  #
  #     docker compose -f docker-compose.local.yml --env-file .env.dev \
  #       --profile dev up -d frontend-dev
  #
  # Then open http://localhost:5173, NOT :3000. Port 3000 is the app container
  # serving the production build, which is what deploys; 5173 is this, with hot
  # reload and the dev sign-in harness. The harness only exists in a dev build,
  # so :3000 cannot be signed into without a real Google account and driving the
  # app there is impossible.
  #
  # WHY A CONTAINER AND NOT `npm run dev:stack`
  #
  # Vite 8 needs Node 20.19+. The host has 18.15.0, which was fine until the
  # Vite 5 to 8 upgrade on 2026-08-27 and silently stopped being fine that day:
  # the local UI simply could not be driven any more. Running it here means the
  # floor is a line in this file rather than something each machine has to get
  # right, and matches the node:20-alpine the Dockerfile builds with.
  frontend-dev:
    image: node:20-alpine
    container_name: syntextai-frontend-dev
    profiles: ["dev"]
    working_dir: /app
    volumes:
      - ./frontend:/app
      # node_modules must NOT come from the host. Vite 8 bundles with rolldown,
      # which ships a platform-specific native binary, and the host's is
      # darwin-arm64. A named volume keeps the linux one here and stops the bind
      # mount hiding it.
      - frontend_dev_node_modules:/app/node_modules
    env_file:
      - .env.dev
    environment:
      # Reach the API by service name. 127.0.0.1 is this container.
      - VITE_API_TARGET=http://syntextaiapp:3000
      - VITE_DEV_PORT=5173
      - VITE_POLL=1
    ports:
      - "5173:5173"
    # Install only when the volume is empty, so a restart is seconds rather than
    # a full npm ci. Delete the volume to force a clean install:
    #   docker volume rm app_frontend_dev_node_modules
    command: >
      sh -c "[ -d node_modules/vite ] || npm ci;
             exec npx vite --host 0.0.0.0"
    depends_on:
      - syntextaiapp
    networks:
      - syntextai_network

networks:
  syntextai_network:
    driver: bridge

volumes:
  postgres_local_data:
  frontend_dev_node_modules: